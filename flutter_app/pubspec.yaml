name: fixify_app
description: "Fixify — Aplikasi pelanggan: booking teknisi terpercaya datang ke lokasi."
publish_to: "none"
version: 1.2.3+8

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0        # auth + database + storage
  firebase_core: ^4.2.0           # inisialisasi Firebase (wajib untuk FCM)
  firebase_messaging: ^16.0.3     # push notification Android (tugas baru, status pesanan)
  image_picker: ^1.1.2            # pilih foto (bukti bayar, lampiran keluhan)
  flutter_image_compress: ^2.3.0  # resize+compress sebelum upload (paritas dgn web)
  flutter_map: ^8.1.1             # peta OSM gratis — pilih titik lokasi (tanpa API key)
  latlong2: ^0.9.1                # tipe lat/lng companion flutter_map
  url_launcher: ^6.3.0            # buka rute Google Maps dari detail pesanan teknisi
  geolocator: ^13.0.1             # GPS on-duty teknisi (simpan lokasi saat layar Pekerjaan aktif)
  intl: ^0.19.0                   # format rupiah & tanggal id-ID
  http: ^1.2.0                    # panggil API web (notifikasi admin saat lepas tugas)
  shared_preferences: ^2.3.2      # cache preferensi notifikasi lokal
  path_provider: 2.1.4
  share_plus: ^11.0.0  # v7 hardcode compileSdk 33 -> gagal AAR metadata di CI

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Pelacakan kebocoran di test (dipakai test/flutter_test_config.dart).
  # Versi diselaraskan dengan yang dipakai flutter_test agar tidak konflik.
  leak_tracker_flutter_testing: ^3.0.10

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

  # Roboto dibundel agar SEMUA perangkat dirender dengan font yang sama.
  # Tanpa ini, teks memakai font sistem pabrikan (Samsung/Xiaomi/Oppo/…)
  # yang metrik & ketebalan berbeda dari Roboto AOSP di emulator → tata
  # letak bergeser/terpotong dan berat teks tampak berbeda di seluruh app.
  # Lisensi font: assets/fonts/Roboto-OFL.txt (SIL Open Font License 1.1).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
