# Build APK Android Fixify di runner GitHub.
#
# Latar: PC pengembang tidak punya Android SDK/JDK. Workflow ini membangun
# APK release ter-obfuscate dari flutter_app dengan --split-per-abi
# (fat APK 57 MB → ±20 MB per varian), mengunggahnya sebagai ASET GITHUB
# RELEASE (tag `apk-latest`) di:
#   - fixify-arm64.apk  → HP Android modern (64-bit, mayoritas)
#   - fixify-armv7a.apk → HP Android lama (32-bit)
# lalu hanya meng-commit public/apk/manifest.json (versi, ukuran, checksum).
#
# APK TIDAK lagi masuk riwayat Git: sebelumnya setiap rilis menambah ±39 MB ke
# repo dan setiap clone ikut mengunduh tumpukan APK lama. Halaman /unduh
# menunjuk langsung ke aset Release (lihat src/lib/apk-release.js).
#
# Pemicu: push yang mengubah flutter_app/** atau workflow ini sendiri
# (commit manifest menyentuh public/apk/manifest.json → tidak memicu loop).

name: Build APK Android

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-apk.yml"
      # Skrip/docs pendukung tidak perlu build APK ulang:
      - "!flutter_app/android/backup-keystore.sh"
  workflow_dispatch:
    inputs:
      skip_gate:
        description: "Lewati gate probe live (hanya untuk keadaan darurat — rilis tanpa pemeriksaan regresi)"
        type: boolean
        default: false

# Gate di sini menulis lalu menghapus baris uji di tabel PRODUKSI, dan begitu juga
# gate di live-probe.yml. Keduanya ikut terpicu oleh satu push yang menyentuh
# flutter_app/** sekaligus scripts/** — dan saat berjalan bersamaan, keduanya
# saling menghapus/menghitung baris uji lawannya sehingga salah satunya gagal
# dengan exit 1 TANPA ada regresi nyata (probe yang sama lulus sendirian).
# Grup `concurrency` bersifat repo-wide, jadi nama `live-probe` yang sama dengan
# live-probe.yml menyerialkan keduanya: satu lane, tidak ada lagi tabrakan data
# uji. Tidak ada job yang dibatalkan (cancel-in-progress: false).
concurrency:
  group: live-probe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Gate regresi: probe live (realtime + audit F3–F6 + E2E F7) dijalankan LEBIH
  # DULU. Bila ada regresi, job ini gagal dan build/publish APK tidak jalan.
  # Detail: scripts/ci-probe-gate.mjs · workflow manual: live-probe.yml
  live-probe:
    if: ${{ !inputs.skip_gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Publik (sama seperti yang dibundel di APK) — bukan rahasia.
      NEXT_PUBLIC_SUPABASE_URL: https://sgxlnhzezknmdhefsvvu.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_eZZumtCE_tiZI8oB48sn8Q_lInFaxef
      # Rahasia → repository secret. Tanpa ini gate berhenti dengan pesan jelas.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Pasang dependensi
        run: npm ci
      - name: Pastikan secret service-role tersedia
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Gate regresi butuh secret SUPABASE_SERVICE_ROLE_KEY, dan build APK tidak jalan tanpanya. Pilih salah satu: (1) tambahkan secret di Settings → Secrets and variables → Actions, atau (2) jalankan workflow ini manual dengan input skip_gate=true (darurat saja), atau (3) hapus 'needs: live-probe' pada job build-apk."
            exit 1
          fi
      - name: Jalankan gate probe live
        run: |
          set -o pipefail
          npm run verify:live 2>&1 | tee probe.log
      - name: Ringkas kegagalan sebagai annotation
        if: failure()
        run: |
          tail -30 probe.log 2>/dev/null | while IFS= read -r l; do echo "::error::${l:0:170}"; done
      - name: Simpan log probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-log-apk-gate
          path: probe.log
          if-no-files-found: ignore
          retention-days: 7

  build-apk:
    needs: live-probe
    # Job yang di-skip (mis. skip_gate=true) membuat dependennya ikut skip bila
    # tanpa kondisi ini — padahal justru itu tujuan skip_gate.
    if: ${{ always() && (needs.live-probe.result == 'success' || needs.live-probe.result == 'skipped') }}
    runs-on: ubuntu-latest
    # 60 menit: build APK + laporan --analyze-size (build AOT kedua)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Sumber tunggal versi: .fvmrc di akar repo — berkas yang sama dipakai
          # flutter-ci.yml, jadi kedua workflow tak bisa lagi beda versi.
          flutter-version-file: .fvmrc

      # Cek DRIFT versi: Flutter terpasang di runner harus sama dengan pin
      # .fvmrc. Skrip yang sama dipakai dev lokal: npm run verify:flutter-version
      - name: Verifikasi versi Flutter = .fvmrc
        run: node scripts/check-flutter-version.mjs

      # Gate font: `fontFamily` hanya boleh memakai keluarga yang dibundel
      # (pubspec `fonts:`). Nilai asing membuat Flutter diam-diam jatuh ke font
      # sistem pabrikan HP → tampilan berbeda dari emulator. Dicek di sini juga
      # (bukan hanya flutter-ci.yml) karena build-apk menerbitkan APK langsung
      # dari push ke main — rilis harus berhenti sebelum APK dibangun.
      - name: Verifikasi fontFamily hanya font bundel
        run: node scripts/verify-font-family.mjs

      # lib/env_override.dart di-gitignore (digenerate lokal dari .env.local),
      # jadi runner tidak punya file itu — buat sebelum build.
      # Isinya kredensial PUBLIK client Supabase (publishable key): aman
      # dibundel di APK, keamanan dijaga RLS di database.
      - name: Buat lib/env_override.dart
        working-directory: flutter_app
        run: |
          cat > lib/env_override.dart <<'EOT'
          // Dihasilkan oleh CI (.github/workflows/build-apk.yml).
          // Kredensial publik client Supabase — aman dibundel di aplikasi.
          class EnvOverride {
            static const String? supabaseUrl = "https://sgxlnhzezknmdhefsvvu.supabase.co";
            static const String? supabaseAnonKey = "sb_publishable_eZZumtCE_tiZI8oB48sn8Q_lInFaxef";
          }
          EOT

      # Decode release keystore dari GitHub Secrets + tulis key.properties.
      # Bila secret belum di-set, lanjut dengan debug signing (APK terbit,
      # tapi TIDAK bisa install-over-install antar build).
      - name: Siapkan release signing (dari GitHub Secrets)
        working-directory: flutter_app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 belum di-set — APK di-sign dengan debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > fixify-release.keystore
          cat > key.properties <<EOF
          storeFile=../fixify-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=fixify-release
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          EOF

      # Pemeriksa pra-rilis jalur "Masuk dengan Google" di APK:
      #   client Web (sumber default_web_client_id) · package vs applicationId ·
      #   SHA-1 keystore yang MENANDATANGANI build ini vs yang terdaftar di
      #   Google Console (dicatat di flutter_app/android/known-sha1.txt).
      # Gagal di sini = gagal di perangkat (error 12500 / redirect_uri_mismatch),
      # jadi jauh lebih murah ditangkap sekarang daripada setelah APK terbit.
      # `--allow-debug-signing` menjaga jalur darurat yang sudah ada: bila secret
      # keystore belum di-set (APK di-sign debug key), hasilnya "tidak
      # konklusif" (exit 3) → hanya warning, build tetap lanjut seperti semula.
      - if: ${{ !inputs.skip_gate }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Periksa jalur Google Sign-In APK (pra-rilis)
        if: ${{ !inputs.skip_gate }}
        env:
          # Publik — sama dengan yang dipakai gate & ikut dibundel di APK.
          NEXT_PUBLIC_SUPABASE_URL: https://sgxlnhzezknmdhefsvvu.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_eZZumtCE_tiZI8oB48sn8Q_lInFaxef
        run: |
          set -o pipefail
          node scripts/verify-apk-signin.mjs --allow-debug-signing 2>&1 | tee apk-signin.log && exit 0
          kode=${PIPESTATUS[0]}
          [ "$kode" = "3" ] || exit "$kode"
          echo "::warning::Pemeriksa Google Sign-In tidak konklusif (exit 3): biasanya karena secret ANDROID_KEYSTORE_BASE64 belum di-set sehingga APK di-sign debug key. Rincian di apk-signin.log / artifact."

      - name: Simpan log pemeriksa Sign-In
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-signin-log
          path: apk-signin.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      # --obfuscate + --split-debug-info: nama simbol Dart dikaburkan (APK lebih
      # kecil dan lebih sulit dibongkar). Symbol map WAJIB disimpan — tanpa itu
      # stack trace dari perangkat pengguna tak bisa dibaca lagi.
      - name: Build APK release (split per ABI, ter-obfuscate)
        working-directory: flutter_app
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols 2>&1 | tee build.log
          ls -la build/symbols

      # Tanpa symbol map, stack trace dari perangkat pengguna hanya berisi nama
      # simbol teracak sehingga crash tak bisa didiagnosis. Simpan 90 hari;
      # baca dengan: flutter symbolize -i app.android-arm64.symbols < stack.txt
      - name: Simpan symbol map obfuscation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-symbols
          path: flutter_app/build/symbols
          if-no-files-found: warn
          retention-days: 90

      # ================= Google Play: App Bundle (AAB) =================
      # Google Play MEWAJIBKAN App Bundle (bukan APK) sejak lama, dan MENOLAK
      # AAB yang ditandatangani kunci debug. Karena itu langkah ini hanya
      # dijalankan bila key.properties (diisi dari secret
      # ANDROID_KEYSTORE_BASE64 di atas) tersedia; kalau belum, build AAB
      # dilewati dengan PERINGATAN — bukan kegagalan, supaya jalur APK yang
      # sudah berjalan tidak ikut mati. Kelalaian itu tetap tertangkap oleh
      # gate `npm run verify:play` di langkah berikutnya.
      - name: Build AAB release (Google Play)
        working-directory: flutter_app
        run: |
          set -o pipefail
          if [ ! -f android/key.properties ]; then
            echo "::warning::AAB dilewati — ANDROID_KEYSTORE_BASE64 belum di-set. AAB yang dibangun tanpa itu tertandatangani kunci debug dan PASTI ditolak Google Play."
            exit 0
          fi
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols 2>&1 | tee abuild.log

      # Gate kesiapan Play: metadata Android (targetSdk/versi/izin), tanda
      # tangan AAB, aset & teks listing, halaman legal, dan langkah AAB itu
      # sendiri. Menjalankannya di sini (bukan hanya lokal) membuat berkas
      # listing yang menghilang ikut MERAH di rilis berikutnya.
      - name: Gate kesiapan Google Play
        if: ${{ hashFiles('flutter_app/android/key.properties') != '' }}
        run: |
          set -o pipefail
          npm run verify:play 2>&1 | tee play-readiness.log

      - name: Simpan log gate Play
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-readiness-log
          path: play-readiness.log
          if-no-files-found: ignore
          retention-days: 14

      # AAB untuk DIUNGGAH MANUAL ke Play Console (atau nanti lewat Play
      # Developer API). Tidak ikut masuk Git — ukurannya ±50 MB, dan Play
      # sendiri yang menyimpan berkasnya sebagai sumber kebenaran.
      - name: Simpan AAB untuk Play Console
        if: ${{ hashFiles('flutter_app/android/key.properties') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: play-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Diagnostik: bila build gagal, keluarkan ekor log build sebagai
      # annotations error — terbaca lewat API publik tanpa akses admin.
      - name: Diagnostik kegagalan ke annotations
        if: failure()
        working-directory: flutter_app
        run: |
          grep -nE "Error: |error:|kernel_snapshot|Target .* failed|Exception:|Unable to" build.log | tail -22 | while IFS= read -r l; do echo "::error::KEY|${l:0:170}"; done
          if grep -n "What went wrong" build.log > /tmp/w.txt 2>/dev/null; then
            start=$(cut -d: -f1 /tmp/w.txt | head -1)
            sed -n "${start},$((start+6))p" build.log | head -6 | while IFS= read -r l; do echo "::error::WENT|${l:0:170}"; done
          fi
          tail -4 build.log | while IFS= read -r l; do echo "::error::TAIL|${l:0:170}"; done

      # APK mampir sebentar di public/apk/ hanya agar pemeriksa tanda tangan
      # (`verify-apk-signin.mjs --only-apk`, yang memang membaca folder itu)
      # dan unggahan Release bekerja dari satu lokasi. Folder ini DIBERSIHKAN
      # sebelum langkah commit — tidak ada APK yang masuk Git.
      - name: Salin APK per-ABI ke public/apk
        run: |
          mkdir -p public/apk
          # Hapus APK fat lama — digantikan varian per-ABI yang lebih kecil.
          rm -f public/apk/fixify.apk
          cp flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk public/apk/fixify-arm64.apk
          cp flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk public/apk/fixify-armv7a.apk
          ls -la public/apk

      # Manifest untuk halaman /unduh: versi (pubspec.yaml), tanggal build,
      # dan checksum SHA-256 tiap APK — pengguna bisa memverifikasi unduhan.
      - name: Buat manifest unduhan (versi, tanggal, SHA-256, ukuran)
        run: |
          V=$(grep -E '^version:' flutter_app/pubspec.yaml | sed 's/version: *//;s/\r//')
          VER=$(echo "$V" | cut -d+ -f1)
          BUILD=$(echo "$V" | sed -n 's/.*+//p')
          C64=$(sha256sum public/apk/fixify-arm64.apk | cut -d' ' -f1)
          C32=$(sha256sum public/apk/fixify-armv7a.apk | cut -d' ' -f1)
          # Ukuran dalam byte: halaman /unduh menampilkannya tanpa perlu
          # menembak jaringan (aset Release hanya dicek keberadaannya).
          S64=$(stat -c%s public/apk/fixify-arm64.apk)
          S32=$(stat -c%s public/apk/fixify-armv7a.apk)
          cat > public/apk/manifest.json <<EOF
          {
            "version": "$VER",
            "build": "$BUILD",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "checksums": {
              "fixify-arm64.apk": "$C64",
              "fixify-armv7a.apk": "$C32"
            },
            "sizes": {
              "fixify-arm64.apk": $S64,
              "fixify-armv7a.apk": $S32
            }
          }
          EOF
          cat public/apk/manifest.json

      # Verifikasi ARTEFAK yang benar-benar diunduh pengguna: berkas di
      # public/apk/ harus ditandatangani kunci yang SHA-1-nya tercatat, dan
      # SHA-256-nya harus cocok dengan manifest.json yang baru dibuat.
      # Dijalankan SETELAH manifest dibuat dan SEBELUM commit/push, jadi APK
      # yang tidak bisa login Google tidak akan pernah terbit.
      - name: Verifikasi tanda tangan APK yang akan diterbitkan
        run: |
          set -o pipefail
          node scripts/verify-apk-signin.mjs --only-apk 2>&1 | tee apk-terbit.log

      # Laporan "komponen penyumbang ukuran terbesar". --analyze-size TIDAK bisa
      # digabung --split-debug-info (lihat flutter build apk --help), jadi ini
      # build AOT terpisah dan TANPA obfuscation: komposisinya sama, angkanya
      # sedikit berbeda dari APK yang diterbitkan. Dijalankan SETELAH APK
      # disalin ke public/apk supaya tidak menimpa artefak yang akan terbit.
      - name: Laporan ukuran APK (--analyze-size)
        working-directory: flutter_app
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 --analyze-size 2>&1 | tee analyze-size.log
          node ../scripts/summarize-apk-size.mjs --log=analyze-size.log >> "$GITHUB_STEP_SUMMARY"

      # Berkas analisis Flutter ditulis ke ~/.flutter-devtools (di luar
      # workspace), jadi disalin dulu agar bisa diunggah sebagai artifact dan
      # dibuka di DevTools → App Size.
      - name: Simpan berkas analisis ukuran
        if: always()
        run: |
          mkdir -p flutter_app/build/size-report
          cp "$HOME"/.flutter-devtools/apk-code-size-analysis_*.json flutter_app/build/size-report/ 2>/dev/null || echo "::warning::berkas analisis ukuran tidak ditemukan"
          ls -la flutter_app/build/size-report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-size-report
          path: flutter_app/build/size-report
          if-no-files-found: warn
          retention-days: 30

      # URUTAN PENTING: unggah aset rilis DULU, commit manifest BELAKANGAN.
      # Nama aset tetap (di-clobber), jadi selama unggahan berjalan manifest
      # lama masih cocok dengan aset lama. Bila dibalik, pengguna bisa
      # mengunduh berkas baru sambil melihat checksum lama.
      - name: Terbitkan APK ke GitHub Release (tag apk-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          TAG="apk-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Rilis $TAG sudah ada — asetnya diganti (clobber)."
          else
            gh release create "$TAG" \
              --title "APK Android Fixify (rilis bergulir)" \
              --notes "Aset APK diperbarui otomatis oleh .github/workflows/build-apk.yml pada setiap build. Tombol unduh di halaman /unduh menunjuk ke aset di sini."
          fi
          gh release upload "$TAG" \
            public/apk/fixify-arm64.apk \
            public/apk/fixify-armv7a.apk \
            --clobber
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name) — \(.size) byte"'

      # APK tidak lagi di-commit (±39 MB per rilis dulu masuk riwayat Git).
      # Bersihkan working tree agar tidak ada yang ikut ter-commit.
      - name: Bersihkan APK dari working tree
        run: |
          rm -f public/apk/*.apk
          ls -la public/apk

      - name: Commit & push manifest unduhan (bila berubah)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apk/manifest.json
          if git diff --cached --quiet; then
            echo "Manifest identik dengan sebelumnya — tidak ada commit."
            exit 0
          fi
          git commit -m "Manifest unduhan APK (versi, ukuran, checksum)"
          # Commit lain bisa masuk selama build berjalan (race push) —
          # rebase bot commit di atas main terbaru, coba sampai 3x.
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then
              echo "APK ter-commit & ter-push (percobaan $i)."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "::error::Gagal push APK setelah 3 percobaan — main berubah terus (race)."
          exit 1
