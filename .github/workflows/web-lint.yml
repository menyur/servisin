# Lint aplikasi web (Next.js) — pengganti `next lint` yang DIHAPUS di Next 16.
#
# Job ini menjalankan `npm run lint`, yaitu ESLint 9 langsung (bukan lewat
# perintah Next lagi) dengan konfigurasi eslint.config.mjs. Cakupannya:
# src/**, scripts/**, public/sw.js, dan berkas konfigurasi di akar repo.
# Aplikasi Flutter punya pemeriksaan sendiri (flutter analyze) dan sengaja
# tidak disentuh di sini.
#
# Pemicu:
#   pull_request      : semua PR — cocok dijadikan required check.
#   push ke main      : kecuali perubahan yang tidak menyentuh kode web
#                       (flutter_app/**, public/apk/**, docs, *.md).
#   workflow_dispatch : manual dari halaman Actions.
#
# Lokal: npm run lint   (exit ≠ 0 = ada error; warning tidak menggagalkan)
#
# Catatan: gate ini memeriksa ERROR saja. Saat ini repo punya 21 warning yang
# sudah diketahui (10x no-img-element, 5x react-hooks/purity,
# 5x react-hooks/set-state-in-effect, 1x jsx-a11y/alt-text) — lihat komentar
# di eslint.config.mjs. Warning tetap tercetak di log + artifact, tapi tidak
# memblokir PR sampai refactor-nya dikerjakan.

name: Web Lint

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "flutter_app/**"
      - "public/apk/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      # pipefail wajib: tanpa itu `tee` menutupi status keluar eslint.
      - name: Jalankan ESLint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      # Init FCM diperiksa di sini (tanpa jaringan & tanpa rahasia: kunci RSA
      # dibuat lokal) karena kegagalannya SENYAP — notifikasi Android berhenti
      # tanpa error di lint/build. Regresi nyata: firebase-admin v14 menghapus
      # `credential.cert()`, sehingga pengiriman ke APK mati tanpa jejak.
      - name: Verifikasi init FCM (notifikasi Android)
        run: npm run verify:fcm

      # Auth cron diuji di sini karena kegagalannya juga senyap: route hanya
      # menerima x-cron-secret sementara Vercel Cron mengirim Authorization
      # Bearer → jadwal harian 401 tanpa jejak, tugas terjadwal tak pernah jalan.
      - name: Verifikasi auth endpoint cron
        run: npm run verify:cron-auth

      # Tautan Kebijakan Privasi & Syarat di footer diperiksa di sini karena
      # kegagalannya juga senyap: halaman legalnya tetap hidup dan build tetap
      # hijau walau tautannya terhapus dari footer — pengguna (dan peninjau
      # OAuth Google) jadi tak bisa menemukannya. Statis, tanpa jaringan.
      - name: Verifikasi tautan legal di footer
        run: npm run verify:legal-links

      # Pengaturan garansi (saklar + durasi standar) diperiksa di sini karena
      # kegagalannya paling tidak terlihat: durasi per layanan bisa tetap terbaca
      # "7 hari" di mana-mana, padahal setelan admin tidak lagi dipakai — jadi
      # pelanggan dijanjikan garansi yang sudah dimatikan. Statis, tanpa jaringan.
      - name: Verifikasi pengaturan garansi
        run: npm run verify:garansi

      # Izin EXECUTE pada fungsi SQL diperiksa di sini karena kegagalannya
      # benar-benar senyap: PostgreSQL memberi EXECUTE kepada PUBLIC secara
      # default, sehingga RPC yang bukan untuk umum tetap bisa dipanggil
      # pengunjung tanpa login — tanpa ada tes yang merah. Statis, tanpa jaringan.
      - name: Verifikasi izin EXECUTE RPC
        run: npm run verify:rpc-grants-offline

      # Penjaga PENDAFTARAN diperiksa di sini karena kegagalannya tidak terlihat
      # sama sekali: jeda yang hanya hidup di memori proses tetap membuat
      # pendaftaran massal lolos dari instance lain, dan Turnstile yang salah
      # pasang bisa memblokir SEMUA pendaftaran web atau justru tidak diperiksa.
      # `--selftest` = bagian kirim nyata (opt-in) tidak dihitung; sisanya
      # hermetis (admin, RPC, dan Cloudflare tiruan).
      - name: Verifikasi penjaga pendaftaran (pembatas persisten + Turnstile)
        run: npm run verify:signup-endpoint -- --selftest

      # Umur piutang + penghapusan eksplisit diperiksa di sini karena
      # kegagalannya KEUANGAN dan senyap: piutang teknisi yang berhenti bisa
      # menua tanpa ada yang mengingatkan atau memutuskan, dan penghapusan yang
      # salah jalan melepas tagihan yang masih bisa ditagih (atau mengubah buku
      # tanpa jejak). Statis, tanpa jaringan.
      - name: Verifikasi umur piutang & penghapusan
        run: npm run verify:piutang

      # Gerbang privasi "teknisi menuju lokasi" diperiksa di sini karena
      # kegagalannya SENYAP dan berbahaya: melepas satu penjagaan (mis. cek
      # kepemilikan pesanan) tetap membuat peta tampil rapi, hanya saja posisi
      # teknisi bisa dibaca pelanggan lain. Statis, tanpa jaringan.
      - name: Verifikasi gerbang privasi lacak teknisi
        run: npm run verify:trip-share

      # Antrian panel admin diperiksa di sini karena kegagalannya paling sunyi
      # dari semuanya: pesanan baru TIDAK muncul sampai admin me-refresh, tetapi
      # build hijau, badge "Live" tetap hijau, dan tidak ada satu pun error di
      # log. Penyebabnya urutan di klien (join kanal Realtime sebelum token
      # pengguna dipasang → RLS menilai sebagai anon). Statis, tanpa jaringan;
      # sisi databasenya dijaga scripts/verify-realtime.mjs --rls.
      - name: Verifikasi realtime panel admin
        run: npm run verify:admin-realtime

      # Format stylish di lint.log enak dibaca manusia; untuk annotation kita
      # minta laporan JSON (antarmuka stabil) lalu ubah lewat skrip kecil:
      # tiap error jadi annotation dengan berkas + baris + kolom + aturannya,
      # supaya tidak perlu mengunduh artifact untuk tahu apa yang rusak.
      # Formatter bawaan "compact" sudah dihapus di ESLint 9, jadi jangan
      # dipakai lagi.
      - name: Ringkas kegagalan sebagai annotation
        if: failure()
        run: |
          npx eslint . --format=json > lint-report.json 2>/dev/null || true
          node scripts/lint-annotate.mjs lint-report.json

      - name: Simpan log lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: |
            lint.log
            lint-report.json
          if-no-files-found: ignore
          retention-days: 7
