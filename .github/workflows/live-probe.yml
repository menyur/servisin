# Gate regresi LIVE sebelum rilis — realtime + audit keamanan F3–F6.
#
# Probe ini TIDAK read-only: ia membuat baris uji sementara di tabel produksi
# (bookings/reports/chat_messages) plus akun auth sementara, memverifikasi
# perilaku nyata, lalu menghapusnya lagi. Karena itu kredensial service-role
# hanya dipakai di sini, dan pemicunya dibatasi ke tiga jalur:
#
#   workflow_dispatch : manual dari Actions ("Run workflow").
#   schedule          : tiap Senin 02:00 UTC — baseline mingguan.
#   push ke main      : hanya bila file yang memengaruhi gate berubah
#                       (scripts/**, supabase/**, package*.json, workflow ini).
#                       Perubahan flutter_app/** TIDAK memicu di sini: gate-nya
#                       sudah dijalankan build-apk.yml sebelum build APK,
#                       sehingga tak ada data uji produksi yang ditulis dua kali.
#
# Catatan: pemicu otomatis (schedule/push) tetap menulis lalu menghapus data uji
# di produksi. Bila itu tidak diinginkan, hapus blok `schedule:`/`push:` di `on:`.
#
# Cara pakai:
#   GitHub → Actions → "Live Probe (regression gate)" → Run workflow.
#   Lokal: npm run verify:live   (kredensial dari .env.local)
#   Notifikasi produksi saja (tanpa kredensial): npm run verify:notif-env
#
# Secret yang dibutuhkan:
#   SUPABASE_SERVICE_ROLE_KEY  ← satu-satunya rahasia; ada di .env.local lokal
#                                atau Supabase → Settings → API.
# URL proyek & kunci publishable TIDAK perlu secret — keduanya publik dan
# sudah ikut dibundel di APK oleh .github/workflows/build-apk.yml.

name: Live Probe (regression gate)

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Batasi langkah (id dipisah koma). Kosong = semua. Lihat: node scripts/ci-probe-gate.mjs --list"
        required: false
        default: ""
  # Baseline mingguan: Senin 02:00 UTC.
  schedule:
    - cron: "0 2 * * 1"
  # Otomatis saat perubahan yang memengaruhi gate masuk ke main.
  # flutter_app/** sengaja tidak disertakan (gate-nya sudah ada di build-apk.yml).
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      # Konfigurasi OAuth Google ikut memengaruhi pemeriksaan client Web/Android
      # (job `google-provider`) — perubahan di sini harus menjalankannya.
      - "flutter_app/android/app/google-services.json"
      - ".github/workflows/live-probe.yml"

permissions:
  contents: read

concurrency:
  group: live-probe
  cancel-in-progress: false

jobs:
  # Pemeriksaan konfigurasi provider Google Supabase (client Web vs Android).
  # Read-only dan TANPA repository secret, jadi sengaja dipisah dari job di
  # bawah: tetap gagal-terlihat walau SUPABASE_SERVICE_ROLE_KEY belum di-set.
  # (Dependensi tetap dipasang karena langkah smoke selftest butuh
  #  scripts/lib/probe-env.mjs — lihat komentar di langkah `npm ci`.)
  # Pemeriksaan yang sama juga ikut di langkah pertama `npm run verify:live`
  # (scripts/ci-probe-gate.mjs) — di sini ia berjalan sendiri agar statusnya
  # terbaca jelas dan bisa dipakai sebagai required check tersendiri.
  google-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Publik (identik dengan yang dibundel di APK) — bukan rahasia.
      NEXT_PUBLIC_SUPABASE_URL: https://sgxlnhzezknmdhefsvvu.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_eZZumtCE_tiZI8oB48sn8Q_lInFaxef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # `npm ci` WAJIB: `verify-google-provider.mjs` memang hanya memakai modul
      # bawaan Node, tetapi `smoke-google-login.mjs --selftest` (langkah 3 di
      # bawah) mengimpor scripts/lib/probe-env.mjs yang menarik
      # @supabase/supabase-js. Tanpa pemasangan dependensi, langkah itu gagal
      # ERR_MODULE_NOT_FOUND di runner — dulu lolos di lokal hanya karena
      # node_modules sudah ada, sehingga job ini merah terus di CI tanpa alasan
      # yang terlihat. Tidak ada rahasia yang dipakai di job ini.
      - name: Pasang dependensi
        run: npm ci

      - name: Selftest logika pemeriksa (tanpa jaringan)
        run: node scripts/verify-google-provider.mjs --selftest

      # Selftest pemeriksa email: MURNI (tanpa jaringan, tanpa kredensial), jadi
      # aman di CI. Yang dijaga di sini adalah LOGIKA PENILAINYA — syarat lulus
      # gate email dan kalimat "MASALAH TERSISA" dari dokter email; kalau logika
      # itu membusuk, kesimpulannya ikut salah tanpa ada yang tahu. Mode live-nya
      # sengaja TIDAK di sini: butuh produksi + kunci Resend lokal, dan pipeline
      # tidak boleh merah hanya karena kredensial email belum diisi.
      - name: Selftest logika pemeriksa email (tanpa jaringan)
        run: |
          node scripts/verify-email-env.mjs --selftest
          node scripts/verify-email-send.mjs --selftest
          node scripts/verify-email-doctor.mjs --selftest

      # Gerbang DATA UJI: membuktikan akun probe dilewati di SELURUH jalur
      # notifikasi (email & push) dan bahwa penolakan permanen (bounce keras)
      # tidak diulang. Seluruhnya OFFLINE — tanpa kredensial, tanpa jaringan,
      # tanpa menyentuh baris data — jadi aman di CI, dan justru inilah yang
      # melindungi kuota produksi dari probe: kalau ada jalur notifikasi baru
      # yang lupa dipasangi gerbang, CI yang menolaknya, bukan kuota harian yang
      # habis (kejadian 16 Okt 2026: 149 dari 195 email hari itu dari data uji,
      # lalu email pelanggan yang tidak sampai).
      - name: Gerbang data uji di semua jalur notifikasi (tanpa jaringan)
        run: npm run verify:uji-guard

      # Jalur lupa kata sandi: kontrak statis + alur kirim dengan admin & email
      # TIRUAN. Seluruhnya tanpa jaringan dan tanpa kredensial, jadi aman di CI;
      # yang dijaga adalah keseragaman jawaban akun-ada vs akun-tidak-ada
      # (anti-enumerasi) dan jeda per alamat — dua hal yang, kalau rusak,
      # merusak fitur ini secara diam-diam. Mode kirim nyatanya tetap opt-in
      # (--to=…) dan tidak pernah dijalankan di sini.
      # `--selftest` WAJIB: tanpa itu langkah B2 opsional dihitung "dilewati"
      # dan skrip keluar dengan kode 3 (non-konklusif) — CI memperlakukan kode
      # non-nol sebagai gagal, sehingga gate ikut merah walau semua pemeriksaan
      # hermetisnya lulus.
      - name: Selftest jalur reset kata sandi (kontrak + alur tiruan)
        run: node scripts/verify-reset-endpoint.mjs --selftest

      - name: Pastikan provider Google memakai client Web, bukan Android
        run: node scripts/verify-google-provider.mjs

      # Smoke test login Google memerlukan device/emulator (adb), jadi yang
      # dijalankan di sini hanya selftest parser-nya — supaya logika
      # pembacaan intent-filter & isi sesi app tidak ikut membusuk diam-diam.
      # Jalankan penuh di mesin yang punya device: node scripts/smoke-google-login.mjs
      - name: Selftest parser smoke test login Google (tanpa device)
        run: node scripts/smoke-google-login.mjs --selftest

  # Gate go-live notifikasi: memanggil /api/health PRODUKSI dan gagal bila
  # service role / FCM / VAPID tidak terbaca atau init FCM tidak siap.
  # Read-only dan TANPA repository secret (hanya HTTP GET ke endpoint publik),
  # jadi sengaja terpisah: tetap terlihat gagal walau secret service-role belum
  # di-set. Dua kejadian nyata yang dijaga di sini — service role ada di daftar
  # tapi tidak terbaca deployment, dan init firebase-admin v14 gagal senyap —
  # kedua-duanya dulu lolos tanpa satu pun CI merah.
  notif-env:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Tidak perlu `npm ci`: hanya memakai fetch bawaan Node.
      - name: Selftest logika penilai (tanpa jaringan)
        run: node scripts/verify-notif-env.mjs --selftest

      - name: Pastikan notifikasi produksi siap kirim
        run: node scripts/verify-notif-env.mjs

  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Publik (identik dengan yang dipakai build APK) — bukan rahasia.
      NEXT_PUBLIC_SUPABASE_URL: https://sgxlnhzezknmdhefsvvu.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_eZZumtCE_tiZI8oB48sn8Q_lInFaxef
      # Rahasia — hanya diisi dari repository secret.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Pastikan secret service-role tersedia
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY belum di-set. Tambahkan di Settings → Secrets and variables → Actions → New repository secret. Gate ini dipakai untuk semua pemicunya (manual, schedule Senin, dan push ke main), jadi tanpa secret setiap run otomatis akan berhenti di sini."
            exit 1
          fi

      # pipefail wajib: tanpa itu `tee` menutupi status keluar gate.
      - name: Jalankan gate probe live
        run: |
          set -o pipefail
          ONLY="${{ inputs.only }}"
          if [ -n "$ONLY" ]; then
            node scripts/ci-probe-gate.mjs --only="$ONLY" 2>&1 | tee probe.log
          else
            npm run verify:live 2>&1 | tee probe.log
          fi

      - name: Ringkas kegagalan sebagai annotation
        if: failure()
        run: |
          tail -30 probe.log 2>/dev/null | while IFS= read -r l; do echo "::error::${l:0:170}"; done

      - name: Simpan log probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-log
          path: probe.log
          if-no-files-found: ignore
          retention-days: 7
